name: Deploy NEXUS
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v4
        with: 
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx pip-audit
      - name: Run backend tests and data-quality gates
        env:
          PYTHONPATH: backend
          DEBUG: "true"
          LLM_PROVIDER: offline
        run: |
          pytest backend/tests -q
      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  e2e-a11y:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install browser tooling
        working-directory: frontend
        run: |
          npx -y playwright@latest install --with-deps chromium
      - name: Start backend
        working-directory: backend
        env:
          PYTHONPATH: .
          DEBUG: "true"
          ALLOW_DEMO: "true"
          LLM_PROVIDER: offline
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > ../frontend-e2e.log 2>&1 &
      - name: Wait for services
        run: |
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 2
          done
          cat backend-e2e.log || true
          cat frontend-e2e.log || true
          exit 1
      - name: Run golden-path browser e2e
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          npx -y @playwright/test@latest test --config=playwright.config.mjs
      - name: Run Lighthouse accessibility gate
        working-directory: frontend
        run: |
          npx -y @lhci/cli@latest autorun --config=lighthouserc.cjs
      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: |
            backend-e2e.log
            frontend-e2e.log

  build-backend:
    needs: [test, frontend, e2e-a11y]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build, tag, and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t nexus-backend:${{ github.sha }} backend/
          docker tag nexus-backend:${{ github.sha }} $ECR_REGISTRY/nexus-backend:latest
          docker push $ECR_REGISTRY/nexus-backend:latest
      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster nexus --service nexus-api --force-new-deployment

  build-frontend:
    needs: [test, frontend, e2e-a11y]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Build, tag, and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f frontend/Dockerfile.frontend -t nexus-frontend:${{ github.sha }} frontend/
          docker tag nexus-frontend:${{ github.sha }} $ECR_REGISTRY/nexus-frontend:latest
          docker push $ECR_REGISTRY/nexus-frontend:latest
      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster nexus --service nexus-frontend --force-new-deployment
