services:
  # ── Backend API ──
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///app/data/synchain.db
      - SECRET_KEY=${SECRET_KEY:-nexus-dev-secret-change-in-production}
      - DEBUG=${DEBUG:-true}
      - ALLOW_DEMO=${ALLOW_DEMO:-true}
      - LLM_PROVIDER=${LLM_PROVIDER:-offline}
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - api_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
